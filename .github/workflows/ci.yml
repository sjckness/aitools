name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Plugin
        run: python -m unittest discover -s sjck-graph/tests
      - name: Console
        working-directory: console
        run: npm test
      - name: VS Code extension
        working-directory: vscode
        run: npm ci && npm test
