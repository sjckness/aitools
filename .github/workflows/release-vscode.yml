name: Release VS Code extension

# Push a tag like `vscode-v0.1.0` to build the .vsix and attach it to a GitHub release.
on:
  push:
    tags: ['vscode-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run sync
      - run: npm test
      - run: npx tsc -p jsconfig.json
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "vscode-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npx --yes @vscode/vsce package --no-dependencies
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: vscode/*.vsix
          generate_release_notes: true
