<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sjck console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--panel:#12161D;--panel2:#171C25;--line:#232A35;--line2:#1C222C;--fg:#E6EAF0;--fg2:#C3CAD5;--mut:#8B95A5;--acc:#F5A524;
--validated:#3FB950;--running:#4C8DFF;--failed:#F85149;--planned:#F5A524;--idle:#6B7585;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
a{color:var(--acc)}a:hover{color:#FFC35C}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:600 16px var(--mono);letter-spacing:.02em;color:var(--fg);text-decoration:none}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--acc);display:inline-block}
.crumb{font:12px var(--mono);color:var(--mut);letter-spacing:.06em;text-transform:uppercase;overflow-wrap:anywhere}
.wrap{max-width:1360px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.01em}
h2{margin:0;font-size:16px;font-weight:600}
.sub{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
a.card{color:inherit;text-decoration:none;transition:border-color .15s}
a.card:hover,a.card:focus-visible{border-color:#3A4452;outline:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font:600 15px var(--mono);overflow-wrap:anywhere}
.path{font:11px var(--mono);color:var(--mut);overflow-wrap:anywhere}
.goal{font-size:13px;color:var(--fg2);min-height:20px}
.badge{font:10px var(--mono);padding:2px 8px;border-radius:999px;white-space:nowrap}
.track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.track>div{height:4px;background:var(--validated)}
.meta{font:11px var(--mono);color:var(--mut)}
form.add{display:flex;gap:8px;flex-wrap:wrap}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:13px var(--sans);padding:10px 12px;min-height:40px}
input:focus,textarea:focus,select:focus{outline:2px solid #4C8DFF66;border-color:#4C8DFF}
input[type=text]{flex:1 1 280px;font-family:var(--mono)}
textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
label{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
button{min-height:40px;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:500 13px var(--sans);cursor:pointer}
button:hover{border-color:#3A4452}
button.primary{background:var(--acc);border-color:var(--acc);color:#14100A}
button.primary:hover{background:#FFC35C}
button.danger{color:#F85149}
button:disabled{opacity:.5;cursor:not-allowed}
.empty{color:var(--mut);font-size:13px;padding:32px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.err{color:#F85149;font-size:13px;min-height:18px}
.proj{display:flex;flex-wrap:wrap;gap:16px;align-items:stretch}
.viewer{flex:999 1 720px;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);min-height:70vh}
.viewer iframe{display:block;width:100%;height:100%;min-height:70vh;border:0}
.side{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.log{font:12px/1.55 var(--mono);color:var(--fg2);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px;height:340px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.log .cmd{color:var(--mut)}.log .tool{color:#79C0FF}.log .end{color:var(--validated)}.log .bad{color:#F85149}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.live{display:inline-flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.35}}}
</style>
</head>
<body>
<div class="top">
  <a class="brand" href="#/"><i aria-hidden="true"></i>sjck console</a>
  <span class="crumb" id="crumb"></span>
</div>
<main id="app"></main>
<script>
(function(){
var COL={validated:'#3FB950',running:'#4C8DFF',planned:'#F5A524',done:'#3FB950',failed:'#F85149',idle:'#6B7585',unknown:'#6B7585'};
var app=document.getElementById('app'),crumb=document.getElementById('crumb');
var es=null,homeTimer=null;
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(path,opt){opt=opt||{};opt.headers={'content-type':'application/json'};opt.credentials='same-origin';
  return fetch(path,opt).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||r.statusText);return j})})}
function badge(s){var c=COL[s]||'#6B7585';return '<span class="badge" style="color:'+c+';background:'+c+'22">'+esc(s)+'</span>'}
function ago(iso){if(!iso)return '';var s=Math.round((Date.now()-new Date(iso))/1000);
  return s<60?s+' s ago':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'}
function cleanup(){if(es){es.close();es=null}if(homeTimer){clearInterval(homeTimer);homeTimer=null}}

function home(){
  cleanup();crumb.textContent='projects';
  app.innerHTML='<div class="wrap"><div class="row" style="flex-wrap:wrap;align-items:flex-end"><div><h1>Projects</h1><div class="sub">Every repo registered on this machine, with its current sjck run.</div></div></div>'+
    '<div id="grid" class="grid"></div>'+
    '<section class="card"><h2>Add a project</h2><form class="add" id="add"><label for="p" style="position:absolute;left:-9999px">Project path</label><input type="text" id="p" placeholder="/home/you/f1tenth_more" autocomplete="off"><button class="primary" type="submit">Add</button></form><div class="err" id="adderr"></div><div class="sub">Or run <code>sjck add</code> inside the repo.</div></section></div>';
  document.getElementById('add').onsubmit=function(e){e.preventDefault();var v=document.getElementById('p').value.trim();if(!v)return;
    api('/api/projects',{method:'POST',body:JSON.stringify({path:v})}).then(function(){document.getElementById('p').value='';document.getElementById('adderr').textContent='';loadHome()})
    .catch(function(err){document.getElementById('adderr').textContent=err.message})};
  loadHome();homeTimer=setInterval(loadHome,3000);
}
function loadHome(){
  api('/api/projects').then(function(ps){var g=document.getElementById('grid');if(!g)return;
    if(!ps.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">No projects yet. Add one below.</div>';return}
    g.innerHTML=ps.map(function(p){var pct=p.total?Math.round(p.validated/p.total*100):0;
      var run=p.run&&p.run.running?'<span class="live"><i class="dot pulse" style="background:#4C8DFF"></i>console run: '+esc(p.run.kind)+'</span>':'';
      return '<a class="card" href="#/p/'+esc(p.id)+'"><div class="row"><span class="name">'+esc(p.name)+'</span>'+badge(p.status)+'</div>'+
        '<div class="path">'+esc(p.path)+'</div><div class="goal">'+esc(p.goal||'No run yet')+'</div>'+
        '<div class="track"><div style="width:'+pct+'%"></div></div>'+
        '<div class="row meta"><span>'+p.validated+'/'+p.total+' validated'+(p.findings?' · '+p.findings+' findings':'')+'</span><span>'+esc(ago(p.updated))+'</span></div>'+run+'</a>'}).join('');
  }).catch(function(){});
}

function project(id){
  cleanup();
  app.innerHTML='<div class="wrap"><div class="row" style="flex-wrap:wrap;align-items:flex-end"><div style="min-width:0"><h1 id="pname">…</h1><div class="path" id="ppath"></div></div>'+
    '<div class="btns"><span class="live" id="live"><i class="dot" style="background:#6B7585"></i>connecting</span><button class="danger" id="rm" type="button">Remove</button></div></div>'+
    '<div class="proj"><div class="viewer"><iframe id="view" title="Run Viewer" src="/p/'+esc(id)+'/view"></iframe></div>'+
    '<div class="side"><section class="card"><h2>Task</h2>'+
    '<label for="task">What should the graph do?</label><textarea id="task" placeholder="Add load/start/abort services to mission_manager_node"></textarea>'+
    '<div class="btns"><label for="mode">Mode</label><select id="mode"><option value="">auto</option><option>S</option><option>M</option><option>L</option></select>'+
    '<button class="primary" id="plan" type="button">Plan</button><button id="run" type="button">Run</button><button class="danger" id="stop" type="button" hidden>Stop</button></div>'+
    '<div class="sub">Plan prepares and optimizes the graph without running it. Run executes it, or the approved plan if the task is empty.</div><div class="err" id="err"></div></section>'+
    '<section class="card"><div class="row"><h2>Run log</h2><span class="meta" id="rstate">idle</span></div><div class="log" id="log" role="log" aria-live="polite"></div></section></div></div></div>';
  api('/api/projects/'+id).then(function(p){document.getElementById('pname').textContent=p.name;document.getElementById('ppath').textContent=p.path;crumb.textContent='projects / '+p.name})
    .catch(function(e){app.innerHTML='<div class="wrap"><div class="empty">'+esc(e.message)+' — <a href="#/">back</a></div></div>'});
  var log=document.getElementById('log');
  function add(line){var cls=/^\$ /.test(line)?'cmd':/^→ /.test(line)?'tool':/^(done|exit 0)/.test(line)?'end':/^(error|exit [1-9-]|could not)/.test(line)?'bad':'';
    var stick=log.scrollTop+log.clientHeight>=log.scrollHeight-20;var d=document.createElement('div');if(cls)d.className=cls;d.textContent=line;log.appendChild(d);
    while(log.childNodes.length>600)log.removeChild(log.firstChild);if(stick)log.scrollTop=log.scrollHeight}
  function running(on,info){document.getElementById('plan').disabled=on;document.getElementById('run').disabled=on;document.getElementById('stop').hidden=!on;
    document.getElementById('rstate').textContent=on?('running · '+(info&&info.kind||'')):(info&&info.ended?'exit '+info.exitCode:'idle')}
  function start(kind){var task=document.getElementById('task').value.trim(),err=document.getElementById('err');err.textContent='';
    if(kind==='plan'&&!task){err.textContent='Write a task to plan.';return}
    log.innerHTML='';api('/api/projects/'+id+'/runs',{method:'POST',body:JSON.stringify({task:task,kind:kind,mode:document.getElementById('mode').value})})
      .then(function(info){running(true,info)}).catch(function(e){err.textContent=e.message})}
  document.getElementById('plan').onclick=function(){start('plan')};
  document.getElementById('run').onclick=function(){start('run')};
  document.getElementById('stop').onclick=function(){api('/api/projects/'+id+'/runs/stop',{method:'POST'})};
  document.getElementById('rm').onclick=function(){if(!confirm('Remove this project from the console? Its files are not touched.'))return;
    api('/api/projects/'+id,{method:'DELETE'}).then(function(){location.hash='#/'}).catch(function(e){document.getElementById('err').textContent=e.message})};
  var frame=document.getElementById('view'),live=document.getElementById('live');
  es=new EventSource('/api/projects/'+id+'/events');
  es.addEventListener('hello',function(e){live.innerHTML='<i class="dot pulse" style="background:#3FB950"></i>live';var d=JSON.parse(e.data);
    if(d.run){(d.run.lines||[]).forEach(add);running(d.run.running,d.run)}});
  es.addEventListener('data',function(){try{frame.contentWindow.location.reload()}catch(_){frame.src=frame.src}});
  es.addEventListener('log',function(e){add(JSON.parse(e.data).line)});
  es.addEventListener('run',function(e){var info=JSON.parse(e.data);running(false,info);try{frame.contentWindow.location.reload()}catch(_){}});
  es.onerror=function(){live.innerHTML='<i class="dot" style="background:#F85149"></i>reconnecting'};
}

function route(){var m=/^#\/p\/([a-f0-9]{10})$/.exec(location.hash);if(m)project(m[1]);else home()}
window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
